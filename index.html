<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 版本号缓存控制：每次发布更新时，把本文件下方所有 ?v= 参数改为发布当天的 YYYYMMDD，且必须全部一致；下方 _headers 使 index.html 每次重新校验，子资源随版本号变化强制刷新。 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FF8A5C" />
  <title>小年的玩具屋</title>
  <link rel="stylesheet" href="css/theme.css?v=1787043125c" />
  <link rel="stylesheet" href="css/app.css?v=1787043125c" />
</head>
<body>
  <!-- ======== 应用外壳 ======== -->
  <div id="app" class="app-shell">

    <!-- 顶部标题栏 -->
    <header id="app-header" class="app-header">
      <div class="header-inner">
        <div class="header-title" id="header-title">小年的玩具屋</div>
        <div class="header-sub" id="header-sub"></div>
      </div>
    </header>

    <!-- 内容区：四个视图挂载点 -->
    <main id="app-main" class="app-main">
      <section id="view-home" class="view" data-view="home"></section>
      <section id="view-toys" class="view" data-view="toys"></section>
      <section id="view-plan" class="view" data-view="plan"></section>
      <section id="view-profile" class="view" data-view="profile"></section>
    </main>

    <!-- 底部 Tab 导航 -->
    <nav id="tabbar" class="tabbar">
      <button class="tab-btn" data-tab="home" aria-label="首页">
        <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
      </button>
      <button class="tab-btn" data-tab="toys" aria-label="玩具库">
        <span class="tab-icon">🧸</span><span class="tab-label">玩具库</span>
      </button>
      <button class="tab-btn" data-tab="plan" aria-label="玩耍计划">
        <span class="tab-icon">⏱️</span><span class="tab-label">玩耍计划</span>
      </button>
      <button class="tab-btn" data-tab="profile" aria-label="我的">
        <span class="tab-icon">👤</span><span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- ======== 容器：横幅 / Toast / 全屏弹窗 / 首次引导 / 计时器 ======== -->
  <div id="bannerContainer" class="banner-container"></div>
  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot" class="modal-root"></div>
  <div id="onboardingRoot" class="onboarding-root"></div>
  <div id="timerRoot" class="timer-root"></div>

  <!-- ======== 脚本（零依赖，按依赖顺序加载） ======== -->
  <script src="js/store.js?v=1787043125c"></script>
  <script src="js/rules.js?v=1787043125c"></script>
  <script src="js/ui.js?v=1787043125c"></script>
  <script src="js/views/home.js?v=1787043125c"></script>
  <script src="js/views/toys.js?v=1787043125c"></script>
  <script src="js/views/plan.js?v=1787043125c"></script>
  <script src="js/views/profile.js?v=1787043125c"></script>
  <script src="js/app.js?v=1787043125c"></script>
</body>
</html>
